name: Bug report
description: Report a reproducible problem with Irrigator.
title: ""
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, follow SECURITY.md instead of posting sensitive details here.
        Use a minimal mock reproduction. Remove credentials, private prompts, and personal paths from logs.
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: What command or action triggered the problem?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include a small plan or command sequence when possible. Avoid private run-state dumps.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Irrigator version or commit, OS and architecture, Go version if built locally, and native/container/emulated execution.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant evidence
      description: Redacted error output and any checks already attempted. Mention uncertain operations without replaying them.
