name: Release dry run

# Builds snapshot archives with GoReleaser and uploads nothing: no release, no
# artifact upload, no signing key, no write permissions.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .goreleaser.yaml
      - .github/workflows/release-dry-run.yml
      - tools/release-sign/**
      - docs/release-pipeline.md
      - docs/update-verification.md
      - internal/selfupdate/**

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    name: GoReleaser snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
      - name: Test the signer against the update verifier
        run: go test ./tools/release-sign
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.12.0
          args: release --snapshot --clean --skip=publish
      - name: List snapshot archives
        run: ls -l dist/*.tar.gz dist/checksums.txt
