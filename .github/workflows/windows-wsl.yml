name: Windows (WSL)

# Runs the Linux build inside WSL 2 on a Windows host: the path Windows users
# take today. Native Windows is not supported (see docs/platform-support.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-wsl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wsl:
    name: WSL 2 / Ubuntu 24.04
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: wsl-bash {0}
    steps:
      - name: Install Ubuntu 24.04 in WSL 2
        uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: git make gcc libc6-dev tmux ca-certificates curl python3

      - name: Install Go (toolchain pinned in go.mod)
        run: |
          curl -fsSL https://go.dev/dl/go1.27.2.linux-amd64.tar.gz | tar -C /usr/local -xz
          ln -s /usr/local/go/bin/go /usr/local/go/bin/gofmt /usr/local/bin/

      # Run as an unprivileged user, like the Linux job: tests cover permission checks.
      - name: Create unprivileged user
        run: useradd --create-home --shell /bin/bash builder

      - name: Run later steps as that user
        uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          wsl-shell-user: builder
          wsl-shell-command: bash --noprofile --norc -euo pipefail

      # Clone inside the WSL filesystem, where users keep their checkouts. A Windows-side
      # checkout under /mnt would bring NTFS semantics and CRLF conversion.
      - name: Check out inside WSL
        run: |
          git init -q ~/irrigator
          cd ~/irrigator
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git fetch -q --depth=1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD

      - name: Record environment
        run: |
          uname -a
          cat /proc/version
          go version
          tmux -V
          id

      - name: Build and first-use acceptance
        run: cd ~/irrigator && make build smoke demo

      - name: Runtime race suite and vet (untagged)
        run: cd ~/irrigator && make check

      - name: Integration race suite (build tag integration)
        run: cd ~/irrigator && make check-integration
